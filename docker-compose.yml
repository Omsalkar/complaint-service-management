services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports: ["8000:8000"]
    environment:
      AUTH_URL: http://auth-service:8001
      USER_URL: http://user-service:8002
      COMPLAINT_URL: http://complaint-service:8003
      ASSIGNMENT_URL: http://assignment-service:8004
      NOTIFICATION_URL: http://notification-service:8005
      JWT_SECRET: super-secret-change-me
    depends_on: [auth-service, user-service, complaint-service, assignment-service, notification-service]

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      JWT_SECRET: super-secret-change-me
      USER_SERVICE_URL: http://user-service:8002
      INTERNAL_API_KEY: college-project-key
      ELK_HOST: logstash
      ELK_PORT: 5000
    volumes: ["auth_data:/data"]
    depends_on: [user-service, logstash]

  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    environment:
      INTERNAL_API_KEY: college-project-key
      ELK_HOST: logstash
      ELK_PORT: 5000
    volumes: ["user_data:/data"]
    depends_on: [logstash]

  complaint-service:
    build:
      context: .
      dockerfile: services/complaint/Dockerfile
    environment:
      INTERNAL_API_KEY: college-project-key
      NOTIFICATION_URL: http://notification-service:8005
      ELK_HOST: logstash
      ELK_PORT: 5000
    volumes: ["complaint_data:/data"]
    depends_on: [notification-service, logstash]

  assignment-service:
    build:
      context: .
      dockerfile: services/assignment/Dockerfile
    environment:
      INTERNAL_API_KEY: college-project-key
      COMPLAINT_URL: http://complaint-service:8003
      NOTIFICATION_URL: http://notification-service:8005
      ELK_HOST: logstash
      ELK_PORT: 5000
    volumes: ["assignment_data:/data"]
    depends_on: [complaint-service, notification-service, logstash]

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      INTERNAL_API_KEY: college-project-key
      ELK_HOST: logstash
      ELK_PORT: 5000
    volumes: ["notification_data:/data"]
    depends_on: [logstash]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: ["es_data:/usr/share/elasticsearch/data"]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    ports: ["5000:5000"]
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on: [elasticsearch]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]

volumes:
  auth_data:
  user_data:
  complaint_data:
  assignment_data:
  notification_data:
  es_data:
