apiVersion: apps/v1
kind: Deployment
metadata: {name: elasticsearch, namespace: complaint-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: elasticsearch}}
  template:
    metadata: {labels: {app: elasticsearch}}
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
        - {name: discovery.type, value: single-node}
        - {name: xpack.security.enabled, value: "false"}
        ports: [{containerPort: 9200}]
---
apiVersion: v1
kind: Service
metadata: {name: elasticsearch, namespace: complaint-system}
spec:
  selector: {app: elasticsearch}
  ports: [{port: 9200, targetPort: 9200}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: logstash, namespace: complaint-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: logstash}}
  template:
    metadata: {labels: {app: logstash}}
    spec:
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:8.15.0
        ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata: {name: logstash, namespace: complaint-system}
spec:
  selector: {app: logstash}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kibana, namespace: complaint-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: kibana}}
  template:
    metadata: {labels: {app: kibana}}
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.15.0
        env:
        - {name: ELASTICSEARCH_HOSTS, value: http://elasticsearch:9200}
        ports: [{containerPort: 5601}]
---
apiVersion: v1
kind: Service
metadata: {name: kibana, namespace: complaint-system}
spec:
  type: NodePort
  selector: {app: kibana}
  ports: [{port: 5601, targetPort: 5601, nodePort: 30560}]
