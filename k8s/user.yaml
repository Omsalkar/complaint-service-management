apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: complaint-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: user-service}
  template:
    metadata:
      labels: {app: user-service}
    spec:
      containers:
      - name: user-service
        image: inspectproj-user-service:latest
        ports: [{containerPort: 8002}]
        env:
        - name: JWT_SECRET
          value: super-secret-change-me
        - name: INTERNAL_API_KEY
          value: college-project-key
        - name: USER_SERVICE_URL
          value: http://user-service:8002
        - name: NOTIFICATION_URL
          value: http://notification-service:8005
        - name: COMPLAINT_URL
          value: http://complaint-service:8003
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: complaint-system
spec:
  selector: {app: user-service}
  ports:
  - port: 8002
    targetPort: 8002

