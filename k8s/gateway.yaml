apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: complaint-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
      - name: gateway
        image: inspectproj-gateway:latest
        ports: [{containerPort: 8000}]
        env:
        - name: JWT_SECRET
          value: super-secret-change-me
        - name: AUTH_URL
          value: http://auth-service:8001
        - name: USER_URL
          value: http://user-service:8002
        - name: COMPLAINT_URL
          value: http://complaint-service:8003
        - name: ASSIGNMENT_URL
          value: http://assignment-service:8004
        - name: NOTIFICATION_URL
          value: http://notification-service:8005
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: complaint-system
spec:
  type: NodePort
  selector: {app: gateway}
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080

